name: Desktop build

# Installers are published only for a version tag: either a pushed `v*` tag or
# a manual run with `publish` ticked, which cuts the tag from the version in
# tauri.conf.json. A manual run without it builds the same four targets and
# leaves the bundles as run artifacts, so the pipeline can be exercised without
# cutting a release.
#
# A webview app does not cross-compile, so each target builds on its own runner.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish installers to a release. The tag comes from the version in tauri.conf.json.'
        type: boolean
        required: false
        default: false

jobs:
  build:
    permissions:
      # tauri-action creates the release through the API on a tag build.
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-intel
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: artifacts/api-workbench/src-tauri -> target

      # Frozen is safe here because rollup, lightningcss, @tailwindcss/oxide and
      # esbuild have their per-platform binaries declared as direct optional
      # dependencies, so the lockfile carries all four platforms and each runner
      # installs the one that matches it. Without that, a lockfile resolved on
      # Linux leaves macOS and Windows with a rollup that cannot load itself.
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc code signature ("-") for the macOS bundles. Without any
          # signature at all, an arm64 app fails Gatekeeper's check outright and
          # macOS reports it as "damaged"; ad-hoc makes the signature valid, so
          # the first run is an "unidentified developer" prompt the user can
          # accept. Removing the prompt needs a paid Developer ID plus
          # notarization -- see the Desktop section of replit.md.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          projectPath: artifacts/api-workbench
          args: --target ${{ matrix.target }}
          # Empty on a manual run with `publish` off, which makes tauri-action
          # build without touching releases. Otherwise __VERSION__ comes from
          # tauri.conf.json, so the tag and the installers always agree.
          tagName: ${{ (github.ref_type == 'tag' || inputs.publish) && 'v__VERSION__' || '' }}
          releaseName: Kavo v__VERSION__
          releaseBody: |
            Kavo — a fast, keyboard-driven HTTP client.

            Requests are made natively on the desktop, so there is no CORS
            restriction and hosts on your own network are reachable.

            | Platform | File |
            | --- | --- |
            | macOS (Apple Silicon) | `Kavo_*_aarch64.dmg` |
            | macOS (Intel) | `Kavo_*_x64.dmg` |
            | Windows | `.msi` or `.exe` |
            | Linux | `.AppImage`, `.deb` or `.rpm` |

            ### First run on macOS

            macOS says it "could not verify Kavo is free of malware". The
            bundles are signed ad-hoc, not with a paid Apple Developer ID, so
            Gatekeeper cannot attest to the publisher. Drag Kavo to
            Applications, then either run:

            ```sh
            xattr -cr /Applications/Kavo.app
            ```

            or click **OK** on the warning and go to **System Settings ->
            Privacy & Security**, scroll to the bottom and press **Open
            Anyway**. Right-click -> Open no longer works for this on recent
            macOS. Once is enough either way.

            ### First run on Windows

            SmartScreen shows "Windows protected your PC" for the same reason:
            choose **More info -> Run anyway**.

            Full instructions, and what it would take to remove the prompts,
            are in the [README](https://github.com/lucasdias1707/api-workbench#readme).
          releaseDraft: false
          prerelease: false

      # Proof in the log that the bundle carries a valid signature, which is
      # what separates "unidentified developer" from "damaged".
      - name: Verify macOS signature
        if: startsWith(matrix.platform, 'macos')
        run: |
          app=$(find "artifacts/api-workbench/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -1)
          echo "Bundle: $app"
          codesign -dv --verbose=4 "$app"
          codesign --verify --verbose=2 "$app"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: kavo-${{ matrix.name }}
          path: artifacts/api-workbench/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 14
