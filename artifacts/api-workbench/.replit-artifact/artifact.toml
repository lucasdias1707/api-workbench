kind = "web"
previewPath = "/"
title = "Kavo"
description = "Um cliente desktop moderno para criar, organizar e testar requisições HTTP com coleções, ambientes, histórico e uma visualização clara das respostas."
version = "1.0.0"
id = "artifacts/api-workbench"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21728

[services.development]
run = "pnpm --filter @workspace/api-workbench run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/api-workbench", "run", "build" ]
serve = "static"
publicDir = "artifacts/api-workbench/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21728"
BASE_PATH = "/"
