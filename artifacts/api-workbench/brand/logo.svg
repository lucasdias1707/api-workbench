<!--
  The mark is a request: a stroke leaves, strikes the cushion on the right and
  comes back at a new angle. Blue is the app's accent token, amber is the
  colour it already gives POST, and those two are the only colours in it.

  Deliberately flat and thick. No gradient survives a 16px favicon, and the
  strokes are 11% of the canvas so the silhouette holds at tab size. Collapse
  the two stroke colours into one and it still reads, which is what the macOS
  menu bar and the Windows tray need.

  This file is the source of truth. public/favicon.svg is this artwork without
  the comment, and the app icons are generated from brand/logo.png by the
  tauri CLI (see the Brand section of ARCHITECTURE.md).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="App icon">
  <rect width="512" height="512" rx="112" fill="#181b21"/>
  <g fill="none" stroke-width="58" stroke-linecap="round">
    <path d="M104 140 L400 256" stroke="#5b83f5"/>
    <path d="M400 256 L104 372" stroke="#e0913f"/>
  </g>
  <rect x="386" y="100" width="44" height="312" rx="22" fill="#f2f4f8"/>
</svg>
