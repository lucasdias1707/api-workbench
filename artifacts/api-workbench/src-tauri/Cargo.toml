[package]
name = "kavo"
version = "0.1.2"
description = "Kavo — a fast, keyboard-driven HTTP client"
authors = ["Kavo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kavo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Requests are made from Rust, which is what frees the desktop build from CORS
# and lets it reach localhost and the LAN like any other native client.
tauri-plugin-http = "2"

[features]
# Used by `tauri dev`; keeps the devtools out of release bundles.
custom-protocol = ["tauri/custom-protocol"]
